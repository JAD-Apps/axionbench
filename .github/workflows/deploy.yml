name: Deploy
# Manual, repeatable publication of the verified product to the independent
# Cloudflare Pages project. Secrets are referenced by name only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-axionbench
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify before publishing
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:data
          npm run test:scoring
      - name: Clean release build
        run: npm run build:release
      - name: Publish to the independent Pages project
        run: npx --yes wrangler@4.145.0 pages deploy dist --project-name axionbench --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Hosted readback
        run: npm run deploy:readback -- --latest --write deployment-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-record
          path: |
            deployment-record.json
            dist/release-manifest.json
